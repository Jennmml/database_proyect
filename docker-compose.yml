services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    networks:
      - app-network
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=FastFitness123!
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build: ./backend
    ports:
      - "3100:3100"
    networks:
      - app-network
    environment:
      - NODE_ENV=production
    depends_on:
      - sqlserver

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
